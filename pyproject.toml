[project]
name = "msquddpm-reproduction"
version = "0.1.0"
description = "Research-grade reproduction of the original MSQuDDPM"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch>=2.2,<3",
  "numpy>=1.26,<2",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
  "pandas>=2.1,<3",
  "pyyaml>=6,<7",
  "pot>=0.9,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
