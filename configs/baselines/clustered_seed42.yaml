# Canonical CPU teacher baseline: clustered, seed 42.
# Hyperparameters copied from configs/1q_clustered.yaml (paper/official) with all
# hidden values explicit. Do not edit in place; baseline outputs are immutable.
experiment: clustered_seed42
paper_scale: true
canonical_baseline: true
dataset: clustered
seed: 42
dataset_size: 100
T: 6
schedule: cosine
schedule_offset: 0.001  # ASSUMPTION A-001: official code; paper omits epsilon.
n_ancilla: 2
depth: 4
ancilla: haar
loss: wasserstein
epochs: 2001  # ASSUMPTION: official CLI default, not reported per-task by paper.
learning_rate: 0.005  # ASSUMPTION: official CLI default.
gamma: 1.0  # ASSUMPTION: no effective decay; paper decay factor/cadence unknown.
lr_decay_count: 2  # Official count includes the initial rate: one decay when gamma != 1.
sampling_semantics: official
init: normal
device: cpu
dtype: complex128
artifact_schema_version: 1
validation_tolerance: 1.0e-8
provenance_manifest: true
parent_run_id: null
immutable_output: true
output_root: outputs/baselines/clustered_seed42
cluster_acceptance:
  metric: F_gen_0
  aggregation: mean
  seeds: [7, 42, 123]
  minimum: 0.95
  per_seed_pass_fail: false
